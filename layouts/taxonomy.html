{{ define "main" }}
<div class="wrap">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
  </header>
  <ul class="chips chips-large">
    {{- range .Data.Terms.Alphabetical }}
    <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span class="chip-count">{{ .Count }}</span></a></li>
    {{- end }}
  </ul>
</div>
{{ end }}
