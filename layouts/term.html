{{ define "main" }}
<div class="wrap">
  <header class="page-head">
    <p class="page-kicker">{{ .Data.Singular | humanize }}</p>
    <h1>{{ .Title }}</h1>
    <p class="page-subtitle">{{ len .Pages }} post{{ if ne (len .Pages) 1 }}s{{ end }}</p>
  </header>
  <div class="grid">
    {{- range .Pages.ByDate.Reverse }}{{ partial "post-card.html" . }}{{ end }}
  </div>
</div>
{{ end }}
