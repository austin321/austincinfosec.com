{{ define "main" }}
<div class="wrap">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
    {{- with .Params.subtitle }}<p class="page-subtitle">{{ . }}</p>{{ end }}
  </header>

  {{- with .Content }}<div class="prose section-intro">{{ . }}</div>{{ end }}

  {{- with .Pages }}
  <div class="grid">
    {{- range .ByDate.Reverse }}{{ partial "post-card.html" . }}{{ end }}
  </div>
  {{- end }}
</div>
{{ end }}
