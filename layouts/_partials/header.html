<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-mark" aria-hidden="true">AC</span>
      <span class="brand-name">{{ site.Title }}</span>
    </a>

    {{- /* CSS-only menu toggle: visually hidden but still focusable, so the
           burger works with a keyboard and without JavaScript. */}}
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
    <label for="nav-toggle" class="nav-burger" aria-hidden="true">
      <span></span><span></span><span></span>
    </label>

    <nav class="site-nav" aria-label="Main">
      <ul>
        {{- range site.Menus.main }}
        {{- $active := or ($.IsDescendant .Page) (eq $.Page .Page) }}
        <li><a href="{{ .URL }}" {{ if $active }}aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
      <button type="button" class="theme-toggle" aria-label="Toggle colour theme" title="Toggle colour theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>
      </button>
    </nav>
  </div>
</header>
